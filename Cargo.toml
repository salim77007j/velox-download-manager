[workspace]
resolver = "2"
members = ["crates/velox-core", "crates/velox-cli", "crates/velox-gui"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT"
authors = ["Velox Engineering"]
repository = "https://github.com/salim77007j/velox-download-manager"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "net"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.31"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
parking_lot = "0.12"
bytes = "1"
percent-encoding = "2"
url = "2"
directories = "5"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
fs2 = "0.4"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
