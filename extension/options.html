<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 30px auto; background: #fafbfc; color: #24292f; }
  h1 { color: #0B7A79; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; }
  button { margin-top: 18px; background: #0E9F9E; border: 0; color: #fff; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .hint { color: #57606a; font-size: 13px; margin-top: 4px; }
  #saved { color: #1a7f37; font-weight: 600; margin-left: 12px; }
</style></head>
<body>
  <h1>⚡ Velox extension options</h1>
  <label>API token</label>
  <input id="token" placeholder="token from `velox serve --show-token`">
  <div class="hint">The token file lives in the Velox state directory (<code>…/.velox-meta/api-token</code>). Requests go to 127.0.0.1 only.</div>
  <label>Port</label>
  <input id="port" type="number" value="7654">
  <button id="save">Save</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
